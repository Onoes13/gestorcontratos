<h1>Bienvenidos</h1>
<div class="grid">
  <div class="col-1">
    <input pInputText type = "text" [(ngModel)]= "loginService.user" placeholder="User">
  </div>
  <div class="col-4">
    <input pInputText type = "text" [(ngModel)]= "loginService.pass" placeholder="Pass">
  </div>
</div>


<p-button (click)="this.loginService.comprobar()" > Go!!</p-button>
